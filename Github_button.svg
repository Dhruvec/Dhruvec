<svg width="210" height="92" viewBox="0 0 210 92" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradGH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0093E9">
        <animate attributeName="offset" values="0;0.35;0" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#80D0C7">
        <animate attributeName="offset" values="0.5;0.75;0.5" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#13547a">
        <animate attributeName="offset" values="1;0.75;1" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <clipPath id="pillGH">
      <rect x="10" y="10" width="190" height="55" rx="27.5" ry="27.5"/>
    </clipPath>

    <clipPath id="revealGH">
      <circle cx="10" cy="65" r="0">
        <animate attributeName="r" from="0" to="230" dur="1.1s" begin="0.15s"
                 fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </circle>
    </clipPath>

    <linearGradient id="refFadeGH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="maskGH">
      <rect x="0" y="65" width="210" height="27" fill="url(#refFadeGH)"/>
    </mask>

    <filter id="shadowGH" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0093E9" flood-opacity="0.35"/>
    </filter>

    <filter id="blurGH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <g transform="translate(0,88) scale(1,-1)" mask="url(#maskGH)" filter="url(#blurGH)">
    <g clip-path="url(#revealGH)">
      <rect x="10" y="10" width="190" height="55" rx="27.5" ry="27.5" fill="url(#gradGH)"/>
    </g>
  </g>

  <g clip-path="url(#revealGH)">
    <rect x="10" y="10" width="190" height="55" rx="27.5" ry="27.5" fill="url(#gradGH)" filter="url(#shadowGH)"/>
    <g clip-path="url(#pillGH)">
      <ellipse cx="0" cy="37" rx="40" ry="40" fill="#ffffff" opacity="0.2">
        <animateTransform attributeName="transform" type="translate" values="-70 0; 300 0" dur="3s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <text x="105" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">
      🐙 GitHub
    </text>
  </g>
</svg>
